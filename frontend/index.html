<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Miku Ludo Royale</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="brand-box">
        <span class="brand-logo">🎲</span>
        <div>
          <h1 class="brand-title">MIKU LUDO ROYALE</h1>
          <div class="room-pill">
            <span id="connDot" class="conn-dot offline"></span>
            <span id="connText">Connecting...</span>
            <span class="divider">•</span>
            <span>Room: <strong id="roomCodeLabel">----</strong></span>
          </div>
        </div>
      </div>

      <div class="top-actions">
        <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound">🔊</button>
        <button id="addBotBtn" class="action-chip" title="Add AI Bot">+ 🤖 Bot</button>
        <button id="startMatchBtn" class="action-chip primary-chip">▶ Start</button>
      </div>
    </header>

    <!-- Live Event Banner -->
    <div id="eventBanner" class="event-banner">
      ✨ Room ready! Doston ko join karao ya '+ 🤖 Bot' daba kar match start karo!
    </div>

    <!-- Top Player Cards (Red & Green) -->
    <div class="player-row">
      <div id="card-red" class="player-card card-red">
        <div class="p-avatar" id="avatar-red">🔴</div>
        <div class="p-info">
          <div class="p-name" id="name-red">Waiting...</div>
          <div class="p-sub" id="sub-red">Red Yard</div>
        </div>
        <div class="p-score" id="score-red">0/4</div>
      </div>

      <div id="card-green" class="player-card card-green">
        <div class="p-avatar" id="avatar-green">🟢</div>
        <div class="p-info">
          <div class="p-name" id="name-green">Waiting...</div>
          <div class="p-sub" id="sub-green">Green Yard</div>
        </div>
        <div class="p-score" id="score-green">0/4</div>
      </div>
    </div>

    <!-- Center 15x15 Ludo Board Canvas -->
    <div class="board-wrapper">
      <canvas id="ludoCanvas" width="600" height="600"></canvas>
      <div id="floatingEmojiLayer" class="floating-emoji-layer"></div>
    </div>

    <!-- Bottom Player Cards (Blue & Yellow) -->
    <div class="player-row">
      <div id="card-blue" class="player-card card-blue">
        <div class="p-avatar" id="avatar-blue">🔵</div>
        <div class="p-info">
          <div class="p-name" id="name-blue">Waiting...</div>
          <div class="p-sub" id="sub-blue">Blue Yard</div>
        </div>
        <div class="p-score" id="score-blue">0/4</div>
      </div>

      <div id="card-yellow" class="player-card card-yellow">
        <div class="p-avatar" id="avatar-yellow">🟡</div>
        <div class="p-info">
          <div class="p-name" id="name-yellow">Waiting...</div>
          <div class="p-sub" id="sub-yellow">Yellow Yard</div>
        </div>
        <div class="p-score" id="score-yellow">0/4</div>
      </div>
    </div>

    <!-- Bottom Dice Dock & Quick Emoji Bar -->
    <footer class="bottom-dock">
      <div class="emoji-bar">
        <button class="emoji-btn" data-emoji="😂">😂</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😭">😭</button>
        <button class="emoji-btn" data-emoji="👑">👑</button>
      </div>

      <button id="diceBtn" class="dice-dock-btn">
        <div id="diceCube" class="dice-cube" data-val="6">
          <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          <span class="pip"></span><span class="pip"></span><span class="pip"></span>
        </div>
        <div class="dice-caption" id="diceCaption">ROLL DICE</div>
      </button>

      <div class="emoji-bar">
        <button class="emoji-btn" data-emoji="⚡">⚡</button>
        <button class="emoji-btn" data-emoji="👏">👏</button>
        <button class="emoji-btn" data-emoji="💀">💀</button>
        <button id="resetBtn" class="emoji-btn" title="Reset Board">🔄</button>
      </div>
    </footer>
  </div>

  <!-- Winner Celebration Modal -->
  <div id="winnerModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="trophy-icon">🏆</div>
      <h2 id="winnerTitle">VICTORY!</h2>
      <p id="winnerSubtitle">Player won the Ludo Royale match!</p>
      <div class="modal-actions">
        <button id="playAgainBtn" class="modal-btn primary">🔄 Play Again</button>
        <button id="shareResultBtn" class="modal-btn secondary">📤 Share to Chat</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
